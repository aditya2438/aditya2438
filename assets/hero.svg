<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="hero-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10070C" />
      <stop offset="45%" stop-color="#190B12" />
      <stop offset="100%" stop-color="#10070C" />
    </linearGradient>

    <radialGradient id="hero-radial-wine" cx="80%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#190B12" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10070C" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="hero-radial-rose" cx="15%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#10070C" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#10070C" stop-opacity="0" />
    </radialGradient>

    <!-- Border Gradient with Shimmer -->
    <linearGradient id="hero-border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451126" />
      <stop offset="30%" stop-color="#701A3D" />
      <stop offset="50%" stop-color="#C77B9B">
        <animate attributeName="stop-color" values="#C77B9B;#E5B5C7;#701A3D;#C77B9B" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="70%" stop-color="#701A3D" />
      <stop offset="100%" stop-color="#451126" />
    </linearGradient>

    <!-- Glowing Underline Gradient -->
    <linearGradient id="hero-underline-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.1" />
      <stop offset="25%" stop-color="#701A3D" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#E5B5C7">
        <animate attributeName="stop-color" values="#E5B5C7;#F8F0F3;#C77B9B;#E5B5C7" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="75%" stop-color="#701A3D" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0.1" />
    </linearGradient>

    <!-- Pulse Path Gradient -->
    <linearGradient id="hero-wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0.2" />
      <stop offset="40%" stop-color="#701A3D" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#C77B9B" />
      <stop offset="60%" stop-color="#701A3D" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#451126" stop-opacity="0.2" />
    </linearGradient>

    <!-- Fine Technical Grid -->
    <pattern id="hero-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#701A3D" stroke-width="0.75" stroke-opacity="0.16" />
      <circle cx="30" cy="0" r="1" fill="#C77B9B" fill-opacity="0.18" />
    </pattern>

    <!-- Mask to soften grid boundaries -->
    <radialGradient id="hero-grid-mask-grad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <mask id="hero-grid-mask">
      <rect width="920" height="340" fill="url(#hero-grid-mask-grad)" />
    </mask>

    <filter id="hero-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SFMono-Regular', 'JetBrains Mono', 'Fira Code', 'Consolas', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .title { font-weight: 800; letter-spacing: 2px; }
    .tagline { font-weight: 500; letter-spacing: 0.5px; }
    .eyebrow { font-weight: 700; letter-spacing: 2px; }
  </style>

  <!-- Base Canvas -->
  <rect width="920" height="340" rx="16" fill="url(#hero-bg-grad)" stroke="url(#hero-border-grad)" stroke-width="1.5" />
  
  <!-- Atmospheric Glow Overlays -->
  <rect width="920" height="340" rx="16" fill="url(#hero-radial-wine)" />
  <rect width="920" height="340" rx="16" fill="url(#hero-radial-rose)" />

  <!-- Technical Grid Texture -->
  <rect width="920" height="340" rx="16" fill="url(#hero-grid)" mask="url(#hero-grid-mask)" />

  <!-- Restrained Orbital Geometry & Architecture Ring (Right Canvas) -->
  <g id="orbital-cluster" transform="translate(0, 0)">
    <!-- Outer Technical Caliper Ring -->
    <circle cx="750" cy="165" r="115" fill="none" stroke="#701A3D" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="6 8">
      <animateTransform attributeName="transform" type="rotate" from="0 750 165" to="360 750 165" dur="60s" repeatCount="indefinite" />
    </circle>

    <!-- Mid Rotational Orbit with Cardinal Marks -->
    <circle cx="750" cy="165" r="85" fill="none" stroke="#C77B9B" stroke-width="1.2" stroke-opacity="0.55" stroke-dasharray="16 35 4 35">
      <animateTransform attributeName="transform" type="rotate" from="360 750 165" to="0 750 165" dur="40s" repeatCount="indefinite" />
    </circle>

    <!-- Inner Core Halo -->
    <circle cx="750" cy="165" r="56" fill="none" stroke="#701A3D" stroke-width="1.5" stroke-opacity="0.7" />
    <circle cx="750" cy="165" r="32" fill="#190B12" stroke="#451126" stroke-width="2" />
    <circle cx="750" cy="165" r="14" fill="#C77B9B" fill-opacity="0.85" filter="url(#hero-glow)">
      <animate attributeName="r" values="13;16;13" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="fill-opacity" values="0.75;1;0.75" dur="3.5s" repeatCount="indefinite" />
    </circle>

    <!-- Orbiting Micro Satellites -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 750 165" to="360 750 165" dur="18s" repeatCount="indefinite" />
      <circle cx="806" cy="165" r="3.5" fill="#E5B5C7" filter="url(#hero-glow)" />
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="180 750 165" to="540 750 165" dur="26s" repeatCount="indefinite" />
      <circle cx="835" cy="165" r="2.5" fill="#F8F0F3" />
    </g>

    <!-- Geometric Axis Crosshairs -->
    <line x1="610" y1="165" x2="890" y2="165" stroke="#701A3D" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="3 6" />
    <line x1="750" y1="35" x2="750" y2="295" stroke="#701A3D" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="3 6" />
    
    <!-- System Coordinates -->
    <text x="750" y="278" text-anchor="middle" class="mono" font-size="9" fill="#9D7286" letter-spacing="1.5" opacity="0.85">KERNEL :: DISTRIBUTED_JVM</text>
  </g>

  <!-- Animated Technical Circuit / Sine Wave Path -->
  <path d="M 45 255 L 210 255 L 235 240 L 305 240 L 325 255 L 530 255 L 555 268 L 615 268 L 635 255 L 875 255"
        fill="none" stroke="url(#hero-wave-grad)" stroke-width="1.75" stroke-linecap="round" stroke-dasharray="90 180" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" from="0" to="-540" dur="9s" repeatCount="indefinite" />
  </path>
  <path d="M 45 255 L 210 255 L 235 240 L 305 240 L 325 255 L 530 255 L 555 268 L 615 268 L 635 255 L 875 255"
        fill="none" stroke="#451126" stroke-width="0.8" stroke-opacity="0.35" stroke-linecap="round" />

  <!-- Left Content: Editorial & Technical Identity -->
  <!-- Status Badge Pill -->
  <g transform="translate(50, 42)">
    <rect width="365" height="26" rx="13" fill="#190B12" stroke="#701A3D" stroke-width="1" />
    <!-- Pulsing Live Indicator -->
    <circle cx="15" cy="13" r="4.5" fill="#C77B9B">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="15" cy="13" r="7" fill="none" stroke="#C77B9B" stroke-width="1">
      <animate attributeName="r" values="4.5;9;4.5" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <text x="30" y="17" class="mono eyebrow" font-size="10" fill="#E5B5C7">JAVA BACKEND &amp; DISTRIBUTED SYSTEMS</text>
  </g>

  <!-- Primary Name Heading -->
  <g transform="translate(50, 116)">
    <text x="0" y="0" class="sans title" font-size="42" fill="#F8F0F3">ADITYA CHOUHAN</text>
    <!-- Glowing Animated Accent Line -->
    <rect x="0" y="14" width="480" height="2.5" rx="1.25" fill="url(#hero-underlineGrad)" />
  </g>

  <!-- Role Subtitle / Positioning -->
  <g transform="translate(50, 166)">
    <text x="0" y="0" class="sans tagline" font-size="16" fill="#E5B5C7">
      Scalable Backend Architectures • Distributed Microservices • Spring AI
    </text>
  </g>

  <!-- Core Architectural Tech Stack Ticker -->
  <g transform="translate(50, 204)">
    <text x="0" y="0" class="mono" font-size="12" fill="#C77B9B" letter-spacing="0.5">
      CORE :: Java 21 • Spring Boot 3.3 • Apache Kafka • Redis • PostgreSQL • Docker
    </text>
  </g>

  <!-- Bottom Info Ticker -->
  <g transform="translate(50, 305)">
    <circle cx="4" cy="-4" r="3" fill="#701A3D" />
    <text x="14" y="0" class="mono" font-size="11" fill="#9D7286">
      B.Tech CSE '26 @ SVVV Indore <tspan fill="#701A3D">|</tspan> Haversine &amp; DLQ Implementations <tspan fill="#701A3D">|</tspan> Open to Engineering Opportunities
    </text>
  </g>

  <!-- Top Right Version / Architectural Marker -->
  <g transform="translate(865, 35)">
    <text x="0" y="0" text-anchor="end" class="mono" font-size="10" fill="#701A3D" letter-spacing="1">REV :: 2026.04</text>
  </g>
</svg>
