<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Canvas Gradients -->
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C050A" />
      <stop offset="45%" stop-color="#170A12" />
      <stop offset="100%" stop-color="#0C050A" />
    </linearGradient>

    <radialGradient id="wine-aurora" cx="80%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0.7" />
      <stop offset="45%" stop-color="#701A3D" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0C050A" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="rose-aurora" cx="15%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.5" />
      <stop offset="55%" stop-color="#190B12" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0C050A" stop-opacity="0" />
    </radialGradient>

    <!-- Border Glow with Moving Shimmer -->
    <linearGradient id="hero-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451126" />
      <stop offset="30%" stop-color="#701A3D" />
      <stop offset="50%" stop-color="#C77B9B">
        <animate attributeName="stop-color" values="#C77B9B;#E5B5C7;#701A3D;#C77B9B" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="70%" stop-color="#701A3D" />
      <stop offset="100%" stop-color="#451126" />
    </linearGradient>

    <!-- Shimmer Underline -->
    <linearGradient id="hero-underline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.1" />
      <stop offset="25%" stop-color="#701A3D" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#E5B5C7">
        <animate attributeName="stop-color" values="#E5B5C7;#FFFFFF;#C77B9B;#E5B5C7" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="75%" stop-color="#701A3D" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0.1" />
    </linearGradient>

    <!-- Moving Data Pulse -->
    <linearGradient id="data-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0.1" />
      <stop offset="40%" stop-color="#701A3D" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#E5B5C7" />
      <stop offset="60%" stop-color="#701A3D" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#451126" stop-opacity="0.1" />
    </linearGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="tech-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="28" cy="28" r="1.1" fill="#701A3D" fill-opacity="0.3" />
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#701A3D" stroke-width="0.5" stroke-opacity="0.1" />
    </pattern>

    <radialGradient id="grid-mask" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <mask id="hero-mask">
      <rect width="920" height="350" fill="url(#grid-mask)" />
    </mask>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
    .mono { font-family: 'SFMono-Regular', 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style>

  <!-- Base Canvas -->
  <rect width="920" height="350" rx="16" fill="url(#hero-bg)" stroke="url(#hero-border)" stroke-width="1.5" />
  
  <!-- Aurora Glows -->
  <rect width="920" height="350" rx="16" fill="url(#wine-aurora)" />
  <rect width="920" height="350" rx="16" fill="url(#rose-aurora)" />

  <!-- Subtle Geometric Grid -->
  <rect width="920" height="350" rx="16" fill="url(#tech-dots)" mask="url(#hero-mask)" />

  <!-- Constellation Shimmer Stars -->
  <circle cx="120" cy="70" r="1.5" fill="#E5B5C7">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="480" cy="50" r="1.2" fill="#C77B9B">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="4.2s" repeatCount="indefinite" />
  </circle>
  <circle cx="280" cy="280" r="1.4" fill="#E5B5C7">
    <animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="620" cy="300" r="1.2" fill="#F8F0F3">
    <animate attributeName="opacity" values="0.2;0.95;0.2" dur="2.8s" repeatCount="indefinite" />
  </circle>

  <!-- Orbital Stellar Gyroscope (Right Side) -->
  <g transform="translate(745, 172)">
    <!-- Outer Caliper Orbit -->
    <circle cx="0" cy="0" r="115" fill="none" stroke="#701A3D" stroke-width="1" stroke-opacity="0.45" stroke-dasharray="6 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite" />
    </circle>

    <!-- Mid Rotational Ring with Metric Cuts -->
    <circle cx="0" cy="0" r="86" fill="none" stroke="#C77B9B" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="16 32 4 32">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="40s" repeatCount="indefinite" />
    </circle>

    <!-- Inner Halo -->
    <circle cx="0" cy="0" r="58" fill="none" stroke="#701A3D" stroke-width="1.5" stroke-opacity="0.75" />
    <circle cx="0" cy="0" r="32" fill="#170A12" stroke="#451126" stroke-width="2" />
    
    <!-- Pulsing Core -->
    <circle cx="0" cy="0" r="14" fill="#C77B9B" fill-opacity="0.9" filter="url(#soft-glow)">
      <animate attributeName="r" values="13;17;13" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="fill-opacity" values="0.75;1;0.75" dur="3.5s" repeatCount="indefinite" />
    </circle>

    <!-- Orbiting Satellite 1 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite" />
      <circle cx="58" cy="0" r="3.5" fill="#E5B5C7" filter="url(#soft-glow)" />
    </g>
    <!-- Orbiting Satellite 2 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="26s" repeatCount="indefinite" />
      <circle cx="86" cy="0" r="2.5" fill="#F8F0F3" />
    </g>

    <!-- Axis Crosshairs -->
    <line x1="-140" y1="0" x2="140" y2="0" stroke="#701A3D" stroke-width="0.7" stroke-opacity="0.3" stroke-dasharray="3 6" />
    <line x1="0" y1="-140" x2="0" y2="140" stroke="#701A3D" stroke-width="0.7" stroke-opacity="0.3" stroke-dasharray="3 6" />
  </g>

  <!-- Glowing Traveling Data Stream Path -->
  <path d="M 45 268 L 220 268 L 245 252 L 315 252 L 335 268 L 540 268 L 565 282 L 625 282 L 645 268 L 875 268"
        fill="none" stroke="url(#data-pulse)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="90 180" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" from="0" to="-540" dur="9s" repeatCount="indefinite" />
  </path>
  <path d="M 45 268 L 220 268 L 245 252 L 315 252 L 335 268 L 540 268 L 565 282 L 625 282 L 645 268 L 875 268"
        fill="none" stroke="#451126" stroke-width="0.8" stroke-opacity="0.35" stroke-linecap="round" />

  <!-- LEFT CONTENT -->
  <!-- Status Pill -->
  <g transform="translate(50, 42)">
    <rect width="320" height="26" rx="13" fill="#170A12" stroke="#701A3D" stroke-width="1" />
    <!-- Pulse Beacon -->
    <circle cx="15" cy="13" r="4.5" fill="#C77B9B">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="15" cy="13" r="7" fill="none" stroke="#C77B9B" stroke-width="1">
      <animate attributeName="r" values="4.5;9;4.5" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="17" class="sans" font-size="11" font-weight="600" fill="#E5B5C7" letter-spacing="0.8">AVAILABLE FOR SOFTWARE ENGINEERING</text>
  </g>

  <!-- Name -->
  <g transform="translate(50, 118)">
    <text x="0" y="0" class="sans" font-size="44" font-weight="800" fill="#F8F0F3" letter-spacing="1.5">ADITYA CHOUHAN</text>
    <!-- Shimmer Underline -->
    <rect x="0" y="14" width="460" height="2.5" rx="1.25" fill="url(#hero-underline)" />
  </g>

  <!-- Subtitle -->
  <g transform="translate(50, 168)">
    <text x="0" y="0" class="sans" font-size="16.5" font-weight="500" fill="#E5B5C7">
      Java Backend Developer • Distributed Microservices • Spring AI
    </text>
  </g>

  <!-- Technology Pills -->
  <g transform="translate(50, 204)">
    <!-- Pill 1: Java 21 -->
    <rect x="0" y="0" width="70" height="24" rx="6" fill="#170A12" stroke="#701A3D" stroke-width="0.8" />
    <text x="35" y="16" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#F8F0F3">Java 21</text>

    <!-- Pill 2: Spring Boot 3.3 -->
    <rect x="78" y="0" width="122" height="24" rx="6" fill="#170A12" stroke="#701A3D" stroke-width="0.8" />
    <text x="139" y="16" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#F8F0F3">Spring Boot 3.3</text>

    <!-- Pill 3: Apache Kafka -->
    <rect x="208" y="0" width="108" height="24" rx="6" fill="#170A12" stroke="#701A3D" stroke-width="0.8" />
    <text x="262" y="16" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#F8F0F3">Apache Kafka</text>

    <!-- Pill 4: Redis -->
    <rect x="324" y="0" width="58" height="24" rx="6" fill="#170A12" stroke="#701A3D" stroke-width="0.8" />
    <text x="353" y="16" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#F8F0F3">Redis</text>

    <!-- Pill 5: PostgreSQL -->
    <rect x="390" y="0" width="94" height="24" rx="6" fill="#170A12" stroke="#701A3D" stroke-width="0.8" />
    <text x="437" y="16" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#F8F0F3">PostgreSQL</text>

    <!-- Pill 6: Docker -->
    <rect x="492" y="0" width="66" height="24" rx="6" fill="#170A12" stroke="#701A3D" stroke-width="0.8" />
    <text x="525" y="16" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#F8F0F3">Docker</text>
  </g>

  <!-- Location & Academic details -->
  <g transform="translate(50, 314)">
    <circle cx="4" cy="-4" r="3" fill="#701A3D" />
    <text x="14" y="0" class="sans" font-size="12" fill="#C77B9B" font-weight="500">
      B.Tech CSE '26 @ SVVV Indore <tspan fill="#701A3D">|</tspan> Ujjain &amp; Indore, MP, India <tspan fill="#701A3D">|</tspan> Building High-Throughput Cloud Backends
    </text>
  </g>
</svg>
