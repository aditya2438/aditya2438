<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 90" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="footer-bg-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0C050A" />
      <stop offset="50%" stop-color="#170A12" />
      <stop offset="100%" stop-color="#0C050A" />
    </linearGradient>

    <linearGradient id="footer-border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0.3" />
      <stop offset="35%" stop-color="#701A3D" />
      <stop offset="50%" stop-color="#C77B9B">
        <animate attributeName="stop-color" values="#C77B9B;#E5B5C7;#701A3D;#C77B9B" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="65%" stop-color="#701A3D" />
      <stop offset="100%" stop-color="#451126" stop-opacity="0.3" />
    </linearGradient>

    <radialGradient id="footer-center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0C050A" stop-opacity="0" />
    </radialGradient>

    <filter id="footer-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
    .mono { font-family: 'SFMono-Regular', 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style>

  <!-- Container -->
  <rect width="920" height="90" rx="12" fill="url(#footer-bg-grad)" stroke="url(#footer-border-grad)" stroke-width="1.2" />
  <rect width="920" height="90" rx="12" fill="url(#footer-center-glow)" />

  <!-- Corner Brackets -->
  <path d="M 18 28 L 18 16 L 30 16" fill="none" stroke="#701A3D" stroke-width="1.5" />
  <path d="M 902 28 L 902 16 L 890 16" fill="none" stroke="#701A3D" stroke-width="1.5" />
  <path d="M 18 62 L 18 74 L 30 74" fill="none" stroke="#701A3D" stroke-width="1.5" />
  <path d="M 902 62 L 902 74 L 890 74" fill="none" stroke="#701A3D" stroke-width="1.5" />

  <!-- Animated Center Pulse Beacon -->
  <g transform="translate(460, 22)">
    <circle cx="0" cy="0" r="3" fill="#E5B5C7" filter="url(#footer-glow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="6" fill="none" stroke="#C77B9B" stroke-width="0.8">
      <animate attributeName="r" values="3;9;3" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Center Primary Text -->
  <text x="460" y="46" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#E5B5C7" letter-spacing="1">
    ENGINEERED FOR RESILIENCE, DETERMINISTIC LATENCY &amp; DISTRIBUTED SCALE
  </text>

  <!-- Center Secondary Text -->
  <text x="460" y="68" text-anchor="middle" class="mono" font-size="10" fill="#C77B9B" letter-spacing="0.5">
    Aditya Chouhan • github.com/aditya2438 • linkedin.com/in/aditya-chouhan
  </text>
</svg>
